description: Check gofmt formatting across the tree; fails (listing offending files) if any need formatting.

steps:
  - name: gofmt check
    shell: |
      bad="$(gofmt -l . 2>/dev/null || true)"
      if [ -n "$bad" ]; then
        echo "✗ gofmt would change:" >&2
        echo "$bad" | sed 's/^/  /' >&2
        echo "fix with: gofmt -w <files>" >&2
        exit 1
      fi
      echo "✓ all files gofmt-clean"
    # Spec §6.1: the exit code is this step's whole contract -- it inspects
    # and reports, and there is no state for provision to be unsure about.
    # Without the declaration every run reads `unknown` and
    # `validate --strict` rejects the file.
    changed_when: "false"
