description: Report code-quality soft-cap status (gocyclo > 35; god files > 500 LOC). Informational — does not fail.

props:
  cap_gocyclo:
    type: string
    default: "35"
    description: Cyclomatic-complexity soft cap.
  cap_god_loc:
    type: string
    default: "500"
    description: God-file LOC soft cap.

steps:
  - name: budget-status
    shell: CAP_GOCYCLO="{{ props.cap_gocyclo }}" CAP_GOD_LOC="{{ props.cap_god_loc }}" bash "{{ component_dir }}/scripts/budget-status.sh"
    # Spec §6.1: the exit code is this step's whole contract -- it inspects
    # and reports, and there is no state for provision to be unsure about.
    # Without the declaration every run reads `unknown` and
    # `validate --strict` rejects the file.
    changed_when: "false"
