name: go-quality-ci
description: >-
  Full pre-push gate — build + test + tidy + golangci-lint + govulncheck +
  arch-snapshot + budget + dupl + deps + structure-ratchet. Runs
  scripts/ci/full.sh in the consumer's cwd.
version: 1.1.0

props:
  go_tags:
    type: string
    default: ""
    description: Build tags passed to go build/test/vet, golangci-lint, govulncheck, go list (e.g. "sqlite_fts5"). Empty = none.
  pkg:
    type: string
    default: "./..."
    description: Package pattern the gate operates on.
  deadcode_pkg:
    type: string
    default: "./..."
    description: >-
      Entry packages for the structure-ratchet deadcode pass. Single-main repos
      should pin their command (e.g. "./cmd/foo") so unreachability is measured
      from the real entry point, not every internal package.
  structure_baseline:
    type: string
    default: "benchmark/structure/baseline.json"
    description: Path to the committed structural ratchet baseline (opt-in; absent = skipped).
  cap_direct_deps:
    type: string
    default: "40"
    description: Direct-dependency soft cap for the deps stage. Exceeding it warns, never fails.
  deps_baseline:
    type: string
    default: "benchmark/deps/baseline.txt"
    description: Committed direct-dependency allowlist (opt-in; absent = new-dep enforcement off).

steps:
  - name: go-quality full gate
    shell: >-
      GO_TAGS="{{ props.go_tags }}" PKG="{{ props.pkg }}"
      DEADCODE_PKG="{{ props.deadcode_pkg }}" STRUCTURE_BASELINE="{{ props.structure_baseline }}"
      CAP_DIRECT_DEPS="{{ props.cap_direct_deps }}" DEPS_BASELINE="{{ props.deps_baseline }}"
      bash "{{ component_dir }}/scripts/ci/full.sh"
