description: Compile the project. With `bin` set, produces a named binary from `cmd_path`; otherwise compile-checks `cmd_path`.

props:
  go_tags:
    type: string
    default: ""
    description: Build tags (e.g. "sqlite_fts5"). Empty = none.
  cmd_path:
    type: string
    default: "./..."
    description: Package path to build (e.g. "./cmd/dex"). Defaults to the whole module (compile-check).
  bin:
    type: string
    default: ""
    description: Output binary path. Empty = no -o (compile-check only).
  trimpath:
    type: bool
    default: false
    description: Pass -trimpath for reproducible builds.
  ldflags:
    type: string
    default: ""
    description: Linker flags (e.g. "-s -w" to strip debug info).

steps:
  - name: go build
    shell: go build {% if props.trimpath %}-trimpath {% endif %}{% if props.go_tags %}-tags "{{ props.go_tags }}" {% endif %}{% if props.ldflags %}-ldflags "{{ props.ldflags }}" {% endif %}{% if props.bin %}-o "{{ props.bin }}" {% endif %}{{ props.cmd_path }}
    # Spec §6.1: the exit code is this step's whole contract -- it inspects
    # and reports, and there is no state for provision to be unsure about.
    # Without the declaration every run reads `unknown` and
    # `validate --strict` rejects the file.
    changed_when: "false"
    timeout: 30m
