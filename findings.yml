description: >-
  Aggregate every gate step's `--format jsonl` output into one machine-readable
  findings stream (.gate/findings.jsonl) — the agent-facing view of the gate.
  A pure artifact producer: emitters never abort the aggregation
  and this preset does not re-gate. Enforcement stays with goq/ci (the human
  gate); this just makes the same signal legible to tools. Aggregates ai-lint,
  structure-ratchet, deps and lint-config-check (errors) plus dupl and budget
  (informational warnings). Stays offline and never runs the test suite, so
  goq/cov is deliberately not an emitter here.

props:
  go_tags:
    type: string
    default: ""
    description: Build tags for the structure-ratchet deadcode pass.
  deadcode_pkg:
    type: string
    default: "./..."
    description: Entry packages for the deadcode pass (single-main repos pin ./cmd/<bin>).
  structure_baseline:
    type: string
    default: "benchmark/structure/baseline.json"
    description: Structural ratchet baseline (opt-in; absent = ratchet emits nothing).
  cap_direct_deps:
    type: string
    default: "40"
    description: Direct-dependency soft cap for the deps emitter.
  deps_baseline:
    type: string
    default: "benchmark/deps/baseline.txt"
    description: Direct-dependency allowlist (opt-in; absent = deps emits count findings only).
  out:
    type: string
    default: ".gate/findings.jsonl"
    description: Destination JSONL artifact (gitignored).

steps:
  # Truncate — each run is a fresh snapshot; dedup across runs is the consumer's
  # job via each finding's `fingerprint`.
  - name: reset findings artifact
    shell: 'mkdir -p "$(dirname "{{ props.out }}")" && : > "{{ props.out }}"'
    # Spec §6.1: the exit code is this step's whole contract -- it inspects
    # and reports, and there is no state for provision to be unsure about.
    # Without the declaration every run reads `unknown` and
    # `validate --strict` rejects the file.
    changed_when: "false"

  # --warn-only: ai-lint must not abort the sweep just because it found smells;
  # its findings are captured, the exit code is not the gate here.
  - name: collect ai-lint findings
    shell: >-
      bash "{{ component_dir }}/scripts/ai-lint.sh" --all --format jsonl --warn-only
      >> "{{ props.out }}"
    # Spec §6.1: the exit code is this step's whole contract -- it inspects
    # and reports, and there is no state for provision to be unsure about.
    # Without the declaration every run reads `unknown` and
    # `validate --strict` rejects the file.
    changed_when: "false"

  # `|| true`: structure-ratchet exits 1 when a count grew — that is the gate's
  # job in goq/ci, not here; we only want its findings on the stream.
  - name: collect structure-ratchet findings
    shell: >-
      GO_TAGS="{{ props.go_tags }}" DEADCODE_PKG="{{ props.deadcode_pkg }}"
      STRUCTURE_BASELINE="{{ props.structure_baseline }}"
      bash "{{ component_dir }}/scripts/structure-ratchet.sh" --format jsonl
      >> "{{ props.out }}" || true
    # Spec §6.1: the exit code is this step's whole contract -- it inspects
    # and reports, and there is no state for provision to be unsure about.
    # Without the declaration every run reads `unknown` and
    # `validate --strict` rejects the file.
    changed_when: "false"
    timeout: 30m

  # Informational emitters (level:warning) — never fail, so no `|| true` needed.
  - name: collect dupl findings
    shell: >-
      bash "{{ component_dir }}/scripts/dupl-report.sh" --format jsonl
      >> "{{ props.out }}"
    # Spec §6.1: the exit code is this step's whole contract -- it inspects
    # and reports, and there is no state for provision to be unsure about.
    # Without the declaration every run reads `unknown` and
    # `validate --strict` rejects the file.
    changed_when: "false"

  - name: collect budget findings
    shell: >-
      bash "{{ component_dir }}/scripts/budget-status.sh" --format jsonl
      >> "{{ props.out }}"
    # Spec §6.1: the exit code is this step's whole contract -- it inspects
    # and reports, and there is no state for provision to be unsure about.
    # Without the declaration every run reads `unknown` and
    # `validate --strict` rejects the file.
    changed_when: "false"

  # `--warn-only`: a dependency that is new relative to the baseline is a
  # gate-failing finding in goq/ci, but here we only want it on the stream.
  # No `--updates` — the aggregator stays offline.
  - name: collect deps findings
    shell: >-
      CAP_DIRECT_DEPS="{{ props.cap_direct_deps }}"
      DEPS_BASELINE="{{ props.deps_baseline }}"
      bash "{{ component_dir }}/scripts/deps-status.sh" --format jsonl --warn-only
      >> "{{ props.out }}"
    # Spec §6.1: the exit code is this step's whole contract -- it inspects
    # and reports, and there is no state for provision to be unsure about.
    # Without the declaration every run reads `unknown` and
    # `validate --strict` rejects the file.
    changed_when: "false"
    timeout: 30m

  - name: collect lint-config-check findings
    shell: >-
      bash "{{ component_dir }}/scripts/lint-config-check.sh" --format jsonl --warn-only
      >> "{{ props.out }}"
    # Spec §6.1: the exit code is this step's whole contract -- it inspects
    # and reports, and there is no state for provision to be unsure about.
    # Without the declaration every run reads `unknown` and
    # `validate --strict` rejects the file.
    changed_when: "false"

  # Cheap substring count — findings are one JSON object per line. `grep -c`
  # already prints 0 and exits 1 on no match, so guard with `|| true` (not
  # `|| echo 0`, which would append a second 0).
  - name: summarize
    shell: >-
      echo "findings: $(grep -c . "{{ props.out }}" 2>/dev/null || true) total,
      $(grep -c '"level":"error"' "{{ props.out }}" 2>/dev/null || true) error(s)
      -> {{ props.out }}"
    # Spec §6.1: the exit code is this step's whole contract -- it inspects
    # and reports, and there is no state for provision to be unsure about.
    # Without the declaration every run reads `unknown` and
    # `validate --strict` rejects the file.
    changed_when: "false"
