description: Run govulncheck for known vulnerabilities.

props:
  go_tags:
    type: string
    default: ""
    description: Build tags (e.g. "sqlite_fts5"). Empty = none.
  pkg:
    type: string
    default: "./..."
    description: Package pattern to scan.

steps:
  - name: govulncheck
    shell: govulncheck {% if props.go_tags %}-tags "{{ props.go_tags }}"{% endif %} {{ props.pkg }}
    # Spec §6.1: the exit code is this step's whole contract -- it inspects
    # and reports, and there is no state for provision to be unsure about.
    # Without the declaration every run reads `unknown` and
    # `validate --strict` rejects the file.
    changed_when: "false"
    timeout: 30m
